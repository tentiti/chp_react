<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>춤판</title>
    <style>
      @font-face {
        font-family: "Pretendard-Regular";
        src: url("https://fastly.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Regular.woff")
          format("woff");
        font-weight: 400;
        font-style: normal;
      }

      @font-face {
        font-family: "Cafe24Simplehae";
        src: url("https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.1/Cafe24Simplehae.woff")
          format("woff");
        font-weight: normal;
        font-style: normal;
      }

      body {
        background-color: salmon;
        width: 200vw;
        height: 200vw;
        position: relative;
        overflow: hidden;
        display: flex;
        font-family: "Pretendard-Regular", sans-serif;
      }

      #map-container {
        position: absolute;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 0, 0.2);
        top: 0;
        left: 0;
        transition: transform 0.5s ease-in-out;
      }

      .postcard {
        position: absolute;
        width: 150px;
        height: 150px;
        transition: transform 2s ease-in-out;
      }

      .postcard img {
        width: 100%;
        height: 100%;
      }

      .tooltip {
        position: absolute;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 5px;
        border-radius: 5px;
        display: none;
        white-space: nowrap;
      }

      .move-zone {
        position: fixed;
        /* background-color: rgba(0, 0, 0, 0.5);  */
        z-index: 10;
      }

      #top-zone {
        background-color: rgba(255, 255, 255, 0.5);
        top: 0;
        left: 25vw;
        width: 50vw;
        height: 100px;
      }

      #bottom-zone {
        background-color: rgba(255, 255, 255, 0.5);
        bottom: 0;
        left: 25vw;
        width: 50vw;
        height: 100px;
      }

      #left-zone {
        background-color: rgba(255, 255, 255, 0.5);
        top: 25vh;
        left: 0;
        width: 100px;
        height: 50vh;
      }

      #right-zone {
        background-color: rgba(255, 255, 255, 0.5);
        top: 25vh;
        right: 0;
        width: 100px;
        height: 50vh;
      }

      #minimap-container {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 150px;
        height: 150px;
        background-color: rgba(255, 255, 255, 0.8);
        border: 1px solid #ccc;
        z-index: 1110;
      }

      #minimap {
        width: 100%;
        height: 100%;
        position: relative;
      }

      .minimap-postcard {
        position: absolute;
        width: 5px;
        height: 5px;
      }

      .minimap-gray {
        background-color: #bcbabf;
      }

      .minimap-yellow {
        background-color: #e5e09d;
      }

      .minimap-blue {
        background-color: #66a7b2;
      }

      #minimap-view {
        position: absolute;
        border: 2px solid blue;
        z-index: 30;
      }

      #search-container {
        position: fixed;
        right: 120px;
        top: calc(2.5vh + 100px);
        width: 20%;
        height: calc(90vh - 200px);
        background-color: rgba(255, 255, 255, 0.5);
        padding: 20px;
        box-shadow: -3px 0 5px rgba(0, 0, 0, 0.2);
        z-index: 25;
      }

      #search-input {
        width: 100%;
        padding: 20px;
        box-sizing: border-box;
        margin-bottom: 10px;
        border: 1px solid #ccc;
      }

      #search-results {
        list-style: none;
        padding: 0;
        max-height: calc(100% - 50px);
        overflow-y: auto;
      }

      #search-results li {
        margin-bottom: 10px;
        cursor: pointer;
        color: blue;
      }

      #new-postcard-notification {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        display: none;
        z-index: 1000;
      }

      #tutorial {
        position: fixed;
        bottom: 120px;
        left: 50%;
        width: 500px;
        height: 100px;
        transform: translate(-50%);
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 20px;
        border-radius: 5px;
        z-index: 1000;
      }

      #postcard-detail {
        position: fixed;
        top: 120px;
        left: 120px;
        width: 300px;
        height: calc(300px * (1250 / 720)); /* Dynamically calculates the height */
        background-color: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        display: none;
        z-index: 10000;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat; 
        font-size: 20px;
      }

      #postcard-detail .close-btn {
        position: absolute;
        top: 5px;
        right: 10px;
        cursor: pointer;
        color: white;
        font-weight: bold;
        font-size: 16px;
      }

      /* Comment Section */
      #comment {
        position: absolute;
        top: 72.5%;
        z-index: 900;
        width: 84%;
        color: #412823;
        font-size: 0.6em;
        text-align: center;
        line-height: 2.3;
        font-family: Cafe24Simplehae, sans-serif;
        font-weight: bold;
        word-wrap: break-word;
        overflow-wrap: break-word;
        white-space: normal;
        overflow: hidden;
      }

      /* Timestamp */
      #timestamp {
        position: absolute;
        top: 82%;
        z-index: 900;
        width: 320px;
        color: #412823;
        font-size: 8px;
        text-align: center;
        line-height: 2;
        font-family: Cafe24Simplehae, sans-serif;
        font-weight: bold;
        word-wrap: break-word;
        overflow: hidden;
      }

      /* Name */
      #name {
        position: absolute;
        top: 86%;
        z-index: 900;
        width: 20%;
        color: #412823;
        font-size: 0.6em;
        font-family: Pretendard-Regular, sans-serif;
        left: 67%;
        text-align: center;
        vertical-align: middle;
        overflow: hidden;
        font-weight: bold;
      }

    </style>
  </head>
  <body>
    <h1>춤판</h1>

    <div id="map-container"></div>

    <div class="tooltip" id="tooltip"></div>

    <div class="move-zone" id="top-zone"></div>
    <div class="move-zone" id="bottom-zone"></div>
    <div class="move-zone" id="left-zone"></div>
    <div class="move-zone" id="right-zone"></div>

    <div id="minimap-container">
      <div id="minimap">
        <div id="minimap-view"></div>
      </div>
    </div>

    <div id="search-container">
      <input
        type="text"
        id="search-input"
        placeholder="춤꾼 이름이나 한마디 검색하기.."
      />
      <ul id="search-results"></ul>
    </div>

    <!-- 추가된 div 요소 -->
    <div id="postcard-detail" onclick="closePostcardDetail()">
      <span class="close-btn" onclick="closePostcardDetail()">X</span>
      <div id="postcard-content"></div>
      <img id="gif"></img>
      <div id="comment"></div>
      <div id="timestamp"></div>
      <div id="name"></div>
    </div>

    <div id="new-postcard-notification">새로운 엽서가 추가되었습니다!</div>
    <div id="tutorial"></div>
    <script>
      let loadedPostcards = [];
      let lastTimestamp = "";

      const mapContainer = document.getElementById("map-container");
      const tooltip = document.getElementById("tooltip");
      const minimapContainer = document.getElementById("minimap");
      const minimapView = document.getElementById("minimap-view");
      const searchInput = document.getElementById("search-input");
      const searchResults = document.getElementById("search-results");
      const newPostcardNotification = document.getElementById(
        "new-postcard-notification"
      );

      const mapWidth = window.innerWidth * 2;
      const mapHeight = window.innerHeight * 2;
      const minimapWidth = 150;
      const minimapHeight = 150;

      function loadPostcards() {
        fetch("https://letsdance.kr/api/postcards", { mode: "cors" })
          .then((response) => response.json())
          .then((postcards) => {
            postcards.forEach((postcard) => {
              if (!loadedPostcards.includes(postcard.id)) {
                addPostcardToMap(postcard);
                loadedPostcards.push(postcard.id);
              }
            });
          })
          .catch((error) => {
            console.log("Error loading postcards:", error);
          });
      }

      function addPostcardToMap(postcard) {
        const postcardDiv = document.createElement("div");
        postcardDiv.classList.add("postcard");
        postcardDiv.setAttribute("data-number", postcard.number);
        postcardDiv.setAttribute("data-name", postcard.name);
        postcardDiv.setAttribute("data-comment", postcard.comment);
        postcardDiv.setAttribute("data-timestamp", postcard.timestamp);
        postcardDiv.innerHTML = `
          <img src="https://letsdance.kr/api/uploads/${postcard.gif_name}" alt="${postcard.name}" />
        `;

        const randomX = 150 + Math.random() * (mapWidth - 300);
        const randomY = 150 + Math.random() * (mapHeight - 300);
        postcardDiv.style.left = randomX + "px";
        postcardDiv.style.top = randomY + "px";

        mapContainer.appendChild(postcardDiv);

        const minimapPostcard = document.createElement("div");
        minimapPostcard.classList.add("minimap-postcard");
        if (postcard.number == 1) {
          minimapPostcard.classList.add("minimap-gray");
        } else if (postcard.number == 2) {
          minimapPostcard.classList.add("minimap-yellow");
        } else if (postcard.number == 3) {
          minimapPostcard.classList.add("minimap-blue");
        }

        minimapPostcard.style.left = (randomX / mapWidth) * minimapWidth + "px";
        minimapPostcard.style.top =
          (randomY / mapHeight) * minimapHeight + "px";
        minimapContainer.appendChild(minimapPostcard);

        postcardDiv.addEventListener("mouseover", (e) => {
          tooltip.style.display = "block";
          tooltip.textContent = postcard.name;
          tooltip.style.left = e.pageX + "px";
          tooltip.style.top = e.pageY + "px";
        });

        postcardDiv.addEventListener("mouseout", () => {
          tooltip.style.display = "none";
        });

        postcardDiv.addEventListener("mousemove", (e) => {
          tooltip.style.left = e.pageX + "px";
          tooltip.style.top = e.pageY + "px";
        });

        postcardDiv.addEventListener("click", () => {
          showPostcardDetails(postcardDiv);
        });
      }

      function updateMinimapView() {
        const currentX = parseInt(mapContainer.style.left) || -400;
        const currentY = parseInt(mapContainer.style.top) || -400;
        const viewX = (-currentX / mapWidth) * minimapWidth;
        const viewY = (-currentY / mapHeight) * minimapHeight;
        const viewWidth = (window.innerWidth / mapWidth) * minimapWidth;
        const viewHeight = (window.innerHeight / mapHeight) * minimapHeight;
        minimapView.style.left = viewX + "px";
        minimapView.style.top = viewY + "px";
        minimapView.style.width = viewWidth + "px";
        minimapView.style.height = viewHeight + "px";
      }

      setInterval(() => {
        fetchNewPostcards();
      }, 6000);

      function fetchNewPostcards() {
        fetch("https://letsdance.kr/api/postcards", { mode: "cors" })
          .then((response) => response.json())
          .then((data) => {
            console.log("testing", loadedPostcards);
            let newPostcardsAdded = false;
            data.forEach((postcard) => {
              if (!loadedPostcards.includes(postcard.id)) {
                console.log("New postcard added:", postcard);
                addPostcardToMap(postcard);
                loadedPostcards.push(postcard.id);
                lastTimestamp = postcard.timestamp;
                newPostcardsAdded = true;
              }
            });
            if (newPostcardsAdded) {
              showNewPostcardNotification();
            }
          })
          .catch((error) => {
            console.log("Error fetching new postcards:", error);
          });
      }

      function showNewPostcardNotification() {
        newPostcardNotification.style.display = "block";
        setTimeout(() => {
          newPostcardNotification.style.display = "none";
        }, 3000);
      }

      // 이동 영역 관련 코드
      const moveZones = document.querySelectorAll(".move-zone");
      let isMoving = false;
      let moveInterval;

      moveZones.forEach((zone) => {
        zone.addEventListener("mouseenter", startMoving);
        zone.addEventListener("mouseleave", stopMoving);
      });

      function startMoving(e) {
        if (isMoving) return;
        isMoving = true;
        moveInterval = setInterval(() => moveMap(e.target.id), 50);
      }

      function stopMoving() {
        if (!isMoving) return;
        isMoving = false;
        clearInterval(moveInterval);
      }

      // 미니맵 클릭 이벤트 추가
      minimapContainer.addEventListener("click", (event) => {
        const minimapRect = minimapContainer.getBoundingClientRect();

        // 클릭 위치를 계산
        const clickX = event.clientX - minimapRect.left;
        const clickY = event.clientY - minimapRect.top;

        // 미니맵 비율을 메인 맵 비율로 변환
        const mapX =
          -(clickX / minimapWidth) * mapWidth + window.innerWidth / 2;
        const mapY =
          -(clickY / minimapHeight) * mapHeight + window.innerHeight / 2;

        // 지도 위치 업데이트
        mapContainer.style.left = mapX + "px";
        mapContainer.style.top = mapY + "px";

        updateMinimapView();
      });

      function moveMap(zoneId) {
        const currentX = parseInt(mapContainer.style.left) || -400;
        const currentY = parseInt(mapContainer.style.top) || -400;
        const step = 10;

        let newX = currentX;
        let newY = currentY;

        switch (zoneId) {
          case "top-zone":
            newY = Math.min(currentY + step, -10);
            console.log(newY);
            break;
          case "bottom-zone":
            newY = Math.max(currentY - step, -mapHeight + window.innerHeight);
            break;
          case "left-zone":
            newX = Math.min(currentX + step, -10);
            console.log(newX);
            break;
          case "right-zone":
            newX = Math.max(currentX - step, -mapWidth + window.innerWidth);
            break;
        }

        mapContainer.style.left = newX + "px";
        mapContainer.style.top = newY + "px";
        updateMinimapView();
      }

      // 검색 기능 개선
      searchInput.addEventListener("input", handleSearch);

      function handleSearch() {
        const searchTerm = searchInput.value.toLowerCase();
        const postcards = document.querySelectorAll(".postcard");
        searchResults.innerHTML = "";

        if (searchTerm === "") {
          return;
        }

        postcards.forEach((postcard) => {
          const name = postcard.getAttribute("data-name").toLowerCase();
          const comment = postcard.getAttribute("data-comment").toLowerCase();

          if (name.includes(searchTerm) || comment.includes(searchTerm)) {
            const li = document.createElement("li");
            li.textContent = `${name} - ${comment.substring(0, 30)}...`;
            li.addEventListener("click", () => {
              showPostcardDetails(postcard);
              searchInput.value = "";
              searchResults.innerHTML = "";
            });
            searchResults.appendChild(li);
          }
        });
      }

      function resetPostcardSize() {
        const postcards = document.querySelectorAll(".postcard");
        postcards.forEach((postcard) => {
          postcard.style.transform = "scale(1)";
        });
      }
      

      function focusOnPostcard(postcard) {
        resetPostcardSize(); // Reset all postcards before scaling up the clicked one
  
        const postcardRect = postcard.getBoundingClientRect();
        const mapRect = mapContainer.getBoundingClientRect();

        // 포스트카드의 중심 좌표 계산
        const postcardCenterX = postcardRect.left + postcardRect.width / 2;
        const postcardCenterY = postcardRect.top + postcardRect.height / 2;

        // 지도를 이동시켜야 할 거리 계산
        const moveX = window.innerWidth / 2 - postcardCenterX;
        const moveY = window.innerHeight / 2 - postcardCenterY;

        // 현재 지도 위치에서 이동 거리를 더해 새로운 위치 계산
        const newMapLeft = mapRect.left + moveX;
        const newMapTop = mapRect.top + moveY;

        postcard.style.transition = "transform 0.4s ease";
        postcard.style.transform = "scale(1.3)";

        // 지도 이동
        mapContainer.style.left = newMapLeft + "px";
        mapContainer.style.top = newMapTop + "px";

        updateMinimapView();
      }

      const modelPositions = [
        { x: 16.75, y: 31.5, width: 36.75},
        { x: 33.5, y: 27.7, width: 36.75},
        { x: 42.25, y: 22, width: 36.75},
      ];

      function showPostcardDetails(postcard) {
        resetPostcardSize(); // Reset all postcards before scaling up the clicked one
  
        const postcardDetail = document.getElementById("postcard-detail");
        const gifElement = document.getElementById("gif");
        const timestampElement = document.getElementById("timestamp");
        const commentElement = document.getElementById("comment");
        const nameElement = document.getElementById("name");
        const tutorialelement = document.getElementById("tutorial")
          // Retrieve the position information based on postcard number
        const positionIndex = postcard.dataset.number - 1; // assuming postcard.number is 1-based
        const modelPosition = modelPositions[positionIndex] || modelPositions[0]; // default to first if undefined

        //hide tutorial
        tutorialelement.style.display = "none";
         // Apply the styles to the gifElement based on modelPosition
        gifElement.src = postcard.querySelector("img").src;
        gifElement.style.position = "absolute";
        gifElement.style.top = `calc(${modelPosition.y}% - 2%)`;
        gifElement.style.left = `calc(${modelPosition.x}% + 1%)`;
        gifElement.style.width = `calc(${modelPosition.width}% + 7%)`;
        gifElement.style.height = "auto";
        gifElement.style.display = "block"; // Ensures GIF is visible when loaded


        // Set the content for each element using the postcard's data attributes
        timestampElement.textContent = postcard.dataset.timestamp;
        commentElement.textContent = postcard.dataset.comment;
        nameElement.textContent = postcard.dataset.name;

        // Display the postcard detail container
        postcardDetail.style.display = "block";

        // Set the background image dynamically based on postcard number
        const backgroundIndex = postcard.dataset.number; // default to 1 if not provided
        postcardDetail.style.backgroundImage = `url('share_postcardfinal_${backgroundIndex}.webp')`;

              // Center the postcard on the screen
        const postcardRect = postcard.getBoundingClientRect();
        const mapRect = mapContainer.getBoundingClientRect();

        // Calculate the postcard center coordinates
        const postcardCenterX = postcardRect.left + postcardRect.width / 2;
        const postcardCenterY = postcardRect.top + postcardRect.height / 2;

        // Calculate the movement needed to center the postcard
        const moveX = window.innerWidth / 2 - postcardCenterX;
        const moveY = window.innerHeight / 2 - postcardCenterY;

        // Calculate the new map position
        const newMapLeft = mapRect.left + moveX;
        const newMapTop = mapRect.top + moveY;

        // Move the map container
        mapContainer.style.left = newMapLeft + "px";
        mapContainer.style.top = newMapTop + "px";

        postcard.style.transition = "transform 0.4s ease";
        postcard.style.transform = "scale(1.3)";

        updateMinimapView();
      }

      function closePostcardDetail() {
        resetPostcardSize(); // Reset all postcards before scaling up the clicked one
  
        document.getElementById("postcard-detail").style.display = "none";
        document.getElementById("tutorial").style.display = "flex";
      }

      loadPostcards();
      updateMinimapView();

      // 15분(900초)마다 새로고침
      setInterval(function () {
        window.location.reload();
      }, 900000); // 900,000ms = 15분
    </script>
  </body>
</html>
