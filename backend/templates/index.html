<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />

    <!-- font - inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- font - google icon -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/main_styles.css') }}"
    />

    <title>이젠 댄스타임</title>
  </head>
  <body>
    <header>
      <div class="titleArea">
        <div style="font-family: ClimateCrisisKR-1979">
          <span style="font-weight: 200; font-size: 12px">이제</span><br />
          <span style="font-weight: 400; font-size: 16px">댄스타임</span>
        </div>

        <!-- Changed to use a custom image for the menu icon -->
        <a href="{{ url_for('invitation') }}" class="ajax-link">
          <img
            src="{{ url_for('static', filename='icons/hamburger.png') }}"
            alt="menu"
            id="menu-button"
          />
        </a>
      </div>
    </header>

    <div class="floating"></div>

    <div class="container" id="content">
      <div id="ajax-content">
        <div class="mainImage">
          <img
            id="mainBanner"
            src="../static/stockimages/mainbanner1.png"
            alt="main image"
          />
        </div>

        <div class="image-grid">
          <div class="image-item">
            <img src="https://placehold.co/200x200" alt="grid image 1" />
          </div>
          <div class="image-item">
            <img src="https://placehold.co/200x200" alt="grid image 2" />
          </div>
          <div class="image-item">
            <img src="https://placehold.co/200x200" alt="grid image 3" />
          </div>
          <div class="image-item">
            <img src="https://placehold.co/200x200" alt="grid image 4" />
          </div>
          <div class="image-item">
            <img src="https://placehold.co/200x200" alt="grid image 5" />
          </div>
          <div class="image-item">
            <img src="https://placehold.co/200x200" alt="grid image 6" />
          </div>
          <div class="image-item">
            <img src="https://placehold.co/200x200" alt="grid image 7" />
          </div>
          <div class="image-item">
            <img src="https://placehold.co/200x200" alt="grid image 8" />
          </div>
        </div>
      </div>
    </div>

    <footer>
      <div>2024. 10. 12 - 10.29.</div>
      <div class="footerBorder">|</div>
      <a href="https://google.com">김화순 개인전</a>
      <div class="footerBorder">|</div>
      <a href="https://google.com">자하미술관</a>
    </footer>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script>

    <!-- Three.js Loaders and Controls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>

    <!-- RecordRTC for recording -->
    <script src="https://www.WebRTC-Experiment.com/RecordRTC.js"></script>

    <!-- Main JavaScript file -->
    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
  </body>
</html>
