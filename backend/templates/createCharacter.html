<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />

    <title>Three.js Dress-Up Game</title>

    <!-- CSS 파일 링크 -->
    <link rel="stylesheet" href="static/css/createCharacter.css" />

    <!-- font - inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- font - google icon -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>
  <body style="overflow: auto">
    <div class=".full-viewport-height">
      <div class="header-background"></div>
      <header>
        <div class="titleArea">
          <div>
            <span class="material-symbols-outlined" id="back-button"
              >keyboard_double_arrow_left</span
            >
          </div>
          <div style="font-size: 20px">춤 함께 추기</div>
          <div></div>
        </div>
      </header>

      <div id="overlay" class="overlay">
        <div class="overlay-content">
          <img
            src="../static/stockimages/make_invitation.png"
            alt="Invitation Image"
          />
          <div class="text-overlay">
            <span id='top'>
              우리가 만든 춤판,<br />
              만들 새바람
            </span>
            
            <span id="middle">
              To. 모든 여러분들<br /><br />

    
              정신 없고 복잡한 세상 속에서 안녕하셨나요?<br />
              꽉 찬 달처럼, 세상을 한 번 뒤집을 때가 무르익었어요!<br />
              ‘우리’들의 댄스타임에 초대합니다!<br />
              각자가 원하는 모습으로 함께 춤을 추어요!<br />
              10월 중반. 바람이 부는 날 생명 평화의 나무 밑에서 만나요.<br />
              우리들만의 약속입니다!
            </span>

            <span id="bottom">  
        
                김화순 개인전 : 전시 제목 블라블라 라고 합니다.<br />
                일시 : 2024. 10. 12. - 10. 29.<br />
                위치 : 자하미술관
            
            </span>


            </div>
          </div>
        </div>
      </div>

      <div
        id="container"
        style="display: flex; flex-direction: column; margin-top: 58px"
      >
        <div id="canvasContainer"></div>

        <div class="controls">
          <div class="color-selection">
            <!-- Add color buttons here. These are placeholders for the random colors. -->
            <button style="background-color: #ff0000"></button>
            <button style="background-color: #00ff00"></button>
            <button style="background-color: #0000ff"></button>
            <button style="background-color: #ffff00"></button>
            <button style="background-color: #ff00ff"></button>
            <button style="background-color: #00ffff"></button>
            <button style="background-color: #ff9900"></button>
            <button style="background-color: #99ff00"></button>
          </div>

          <div class="asset-grid">
            <!-- Placeholder images for the assets. Replace with your asset thumbnails -->
            <img src="https://placehold.co/200x200" alt="Asset 1" />
            <img src="https://placehold.co/200x200" alt="Asset 1" />
            <img src="https://placehold.co/200x200" alt="Asset 1" />
            <img src="https://placehold.co/200x200" alt="Asset 1" />
            <img src="https://placehold.co/200x200" alt="Asset 1" />
            <img src="https://placehold.co/200x200" alt="Asset 1" />
            <img src="https://placehold.co/200x200" alt="Asset 1" />
            <img src="https://placehold.co/200x200" alt="Asset 1" />
            <img src="https://placehold.co/200x200" alt="Asset 1" />
            <img src="https://placehold.co/200x200" alt="Asset 1" />
            <img src="https://placehold.co/200x200" alt="Asset 1" />
            <img src="https://placehold.co/200x200" alt="Asset 1" />
            <img src="https://placehold.co/200x200" alt="Asset 1" />
            <img src="https://placehold.co/200x200" alt="Asset 1" />
            <!-- More images can be added here -->
          </div>

          <div id="bottombuttons">
            <div class="category-selection">
              <button id="hat1Button">hat1</button>
              <button id="hat2Button">shat2</button>
              <button id="animateButton">animate</button>
              <button id="ddd">dd</button>
              <button id="accessoriesButton">소품</button>
              <button id="faceButton">얼굴</button>
            </div>

            <button class="create-character" id="saveButton">
              캐릭터 생성하기
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script>

    <!-- Three.js Loaders and Controls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>

    <!-- RecordRTC for recording -->
    <script src="https://www.WebRTC-Experiment.com/RecordRTC.js"></script>

    <!-- Main JavaScript file -->
    <script src="static/js/createCharacter.js"></script>
  </body>
</html>
